name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -B

    - name: Check for compilation warnings
      run: |
        mvn clean compile -B 2>&1 | tee build.log
        if grep -i "warning" build.log; then
          echo "::error::Compilation warnings found. All warnings must be resolved."
          exit 1
        fi
        echo "No compilation warnings found."

    - name: Run tests
      run: mvn test -B

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
