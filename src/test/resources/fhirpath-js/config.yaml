# This file documents exclusions from the test cases along with justification of why the tests
# are excluded and links to related issues.
#
# Initially copied verbatim from Pathling's fhirpath-js/config.yaml (which targets the fhirpath.js
# 3.16.4 reference suite). fp2sql-specific exclusions live in the "fp2sql exclusions" set at the
# top of this file so they can be identified and reviewed separately from the upstream rules.
excludeSet:
  - title: fp2sql exclusions
    glob: "*.yaml"
    exclude:
      # -----------------------------------------------------------------------
      # Unimplemented FHIRPath functions, grouped by spec section. Each group
      # has its own tracking issue so the work can be picked up category by
      # category.
      # -----------------------------------------------------------------------
      - title: Tree navigation functions not yet implemented
        type: feature
        id: "#197"
        comment: |
          children(), descendants(), repeat() not implemented.
          See FHIRPath §5.8 Tree navigation and §5.2.5 repeat.
        function:
          - children
          - descendants
          - repeat
      - title: Utility/environment functions not yet implemented
        type: feature
        id: "#198"
        comment: |
          trace(), now(), today(), timeOfDay() not implemented.
          See FHIRPath §5.9 Utility Functions.
        function:
          - trace
          - now
          - today
          - timeOfDay
      - title: defineVariable() not yet implemented
        type: feature
        id: "#199"
        comment: |
          defineVariable(name [, expr]) for user-defined context variables.
          See FHIRPath §5.9 defineVariable. (fp2sql uses the short name 'define'.)
        function:
          - define
      - title: Boundary/precision functions not yet implemented
        type: feature
        id: "#200"
        comment: |
          lowBoundary(), highBoundary(), precision() not implemented.
          See FHIRPath §5.9 Boundary and §5.9 precision.
        function:
          - lowBoundary
          - highBoundary
          - precision
      - title: aggregate() and aggregate helpers not yet implemented
        type: feature
        id: "#201"
        comment: |
          aggregate() plus sum/min/max/avg helpers. The spec (§Aggregates STU)
          defines only aggregate(); sum/min/max/avg are fhirpath.js extensions
          whose implementation is a product decision tracked by this issue.
        function:
          - aggregate
          - sum
          - min
          - max
          - avg
      - title: Additional String Functions (STU) not yet implemented
        type: feature
        id: "#202"
        comment: |
          encode(), decode(), escape(), unescape() (STU).
          See FHIRPath §Additional String Functions.
        function:
          - encode
          - decode
          - escape
          - unescape
      - title: FHIR terminology functions not yet implemented
        type: feature
        id: "#203"
        comment: |
          subsumes(), subsumedBy(), memberOf(), conformsTo() — require FHIR
          terminology server integration.
        function:
          - subsumes
          - subsumedBy
          - memberOf
          - conformsTo
      - title: FHIR htmlChecks() not yet implemented
        type: feature
        id: "#204"
        function:
          - htmlChecks
      - title: Quantity comparable() not yet implemented
        type: feature
        id: "#205"
        function:
          - comparable
      - title: Registered functions with known gaps
        type: bug
        id: "#209"
        comment: |
          These functions are registered in OperationRegistry but still fail
          specific fhirpath.js compat tests: exclude()/intersect() duplicate
          handling. Skipped here until per-file PRs (Phase 3) move them into
          targeted exclusions.
        function:
          - intersect
          - exclude
      - title: Tick-quoted FHIR type names in is()/as()/ofType()
        type: feature
        id: "#211"
        comment: |
          fp2sql's analyzer rejects FHIR type names written with backtick-quoted
          identifiers (e.g. FHIR.`Patient`) with InvalidExpressionException.
          Tracked under the tick-quoted-identifier umbrella (#211). Will be
          folded into the fhir-r4.yaml per-file block during Phase 3 alongside
          the other #2153 tick-quote rules.
        any:
          - "is(FHIR.`"
          - "as FHIR.`"
          - "as(FHIR.`"
          - "ofType(FHIR.`"
      # -----------------------------------------------------------------------
      # Environment variables, operators and other global concerns.
      # -----------------------------------------------------------------------
      - title: Unsupported FHIRPath environment variables
        type: feature
        id: "#206"
        comment: |
          fp2sql only defines %context. %ucum, %vs-*, %ext-*, %terminologies,
          %sct, %loinc and other extended/terminology variables are unsupported.
        any:
          - "%ucum"
          - "%vs-"
          - "%ext-"
          - "%terminologies"
          - "%`vs-"
          - "%`ext-"
          - "%sct"
          - "%loinc"
      - title: "%factory (Type Factory API) not implemented"
        type: feature
        id: "#194"
        comment: |
          The FHIR-specific Type Factory API (%factory.{primitive}, %factory.Extension,
          %factory.withExtension, %factory.withProperty) is not yet supported.
        any:
          - "%factory"
      - title: Equivalence operators ~ and !~
        type: feature
        id: "#207"
        comment: |
          FHIRPath '~' (equivalence) and '!~' (non-equivalence) are not implemented.
        any:
          - " ~ "
          - " !~ "
      - title: Method-style iif() invocation and 3-arg form
        type: feature
        id: "#186"
        comment: |
          fp2sql only implements the 2-arg iif(criterion, true-result) form.
          Method-style .iif() calls and the 3-arg form (with else-branch) are
          not yet supported.
        any:
          - ".iif("
      - title: Choice type polymorphism
        type: design
        comment: |
          D6. Expressions that operate directly on a FHIR choice element (e.g.
          Observation.value) fail analyzer overload resolution — ofType() is required.
          See SPEC_DIVERGENCES.md D6 (choice type narrowing).
        expression:
          - "Observation\\.value[^\\.]"
          - "MedicationRequest\\.medication[^\\.]"
      - title: Time literals with timezone offset
        type: ref-impl-bug
        comment: |
          R5. FHIRPath spec §5.1 defines Time as a local-time type with no timezone
          offset. fhirpath.js extends Time to accept @T...-05:00 / @T...Z / @T...+04:00
          and evaluates timezone-aware arithmetic/comparison/equality on them.
          fp2sql follows the spec and rejects these literals.
          See SPEC_DIVERGENCES.md R5.
        any:
          - "@T17:00-05:00 < timeWithT.toTime()"
          - "@T17:00-05:00 > timeWithT.toTime()"
          - "@T17:00-05:00 < timeWithOutT.toTime()"
          - "@T17:00-05:00 > timeWithOutT.toTime()"
          - "time.toTime() = @T19:15-05:00"
          - "time.toTime() = @T18:15-05:00"
          - "time.toTime() != @T18:15-05:00"
          - "@T12+04:00 > @T12:02:34.324+05:00"
          - "@T12:02:34.324+05:00 > @T12+05:00"
          - "@T23:59:23-05:00 + 2 minutes = @T00:01:23-05:00"
          - "@T23:59:23-05:00 + 5 milliseconds = @T23:59:23.005-05:00"
          - "@T23:59:23-05:00 + 1.5 seconds = @T23:59:24.500-05:00"
          - "@T23:59:23-05:00 + 1.5 's' = @T23:59:24.500-05:00"
          - "@T23:59:23-05:00 - 1.5 's' = @T23:59:21.500-05:00"
          - "@T23:59:23-05:00 + 1000 milliseconds = @T23:59:24-05:00"
          - "@T23:59:23.005-05:00 + 995 milliseconds = @T23:59:24-05:00"
          - "@T23:59:23.005-05:00 + 1990 milliseconds = @T23:59:24.995-05:00"
          - "@T23:59:23-05:00 + 1.5 hours = @T00:59:23-05:00"
          - "@T10:04:23-04:00 = @T18:04:23+04:00"
          - "@T19:01:23-05:00 = @T00:01:23-00:00"
          - "@T10:04:23-04:00 = @T18:04:24+04:00"
          - "@T10:04:23-04:00 = @T14:04:23Z"
          - "@T10:04:23-04:00 = @T14:04:24Z"
          - "@T10:04:23-04:00 = @T14:04Z"
          - "@T10:05:23-04:00 = @T14:04Z"
          - "@T10:04:23-04:00 != @T18:04:23+04:00"
          - "@T10:04:23-04:00 != @T18:04:24+04:00"
          - "@T10:04:23-04:00 != @T14:04:23Z"
          - "@T10:04:23-04:00 != @T14:04:24Z"
          - "@T09:45Z + 120 seconds = @T04:47-05:00"
          - "@T09:45Z + 59 seconds = @T09:45Z"
          - "@T09:45:23Z + 2 minutes = @T04:47:23.000-05:00"
          - "@T23:59:23Z + 2 minutes = @T00:01:23Z"
      - title: Encoder-rejected resource types (StructureDefinition)
        type: feature
        id: "#208"
        comment: |
          Pathling encoders fp2sql uses cannot serialise StructureDefinition; this
          matcher skips top-level StructureDefinition.* expressions.
          Bundle-backed tests (which reference patient-bundle.json via the subject
          inputfile, not the expression text) are out of this matcher's reach and
          are handled separately at the subject-factory layer. The underlying
          encoder gap is tracked by #208.
        expression:
          - "^StructureDefinition"
  # ---------------------------------------------------------------------------
  # fp2sql — 6.6_math.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — 6.6_math.yaml exclusions
    glob: "6.6_math.yaml"
    exclude:
      - title: Empty list [] inferred as MANY cardinality
        type: bug
        id: "#156"
        comment: |
          YAML subject field n4: [] is inferred as MANY cardinality by
          ResourceTypeInference, causing compile-time CardinalityMismatchException.
        outcome: error
        expression:
          - "^(s5 \\+ n4|n4 \\+ |n4 \\* |\\w+ \\* n4|n4 & |s5 & n4|n1 - n4)"
      - title: Special UCUM unit 'B' not treated as empty
        type: bug
        id: "#157"
        comment: |
          Arithmetic on quantities with special UCUM units like 'B' (bel) should
          return empty per the FHIRPath spec.
        outcome: failure
        any:
          - "1 'B' * 2"
          - "1 'B' + 1 'B'"
          - "1 'B' - 1 'B'"
      - title: UCUM quantity literals in date/time arithmetic
        type: bug
        id: "#158"
        comment: |
          FHIRPath date arithmetic requires calendar duration keywords, not UCUM
          literals ('a', 'mo', 'd', 'wk'). Pathling has the same behavior (#2391).
        outcome: failure
        any:
          - "1 'a' = @2019"
          - "@2018-02 + 1 'mo'"
          - "+ 29 'd'"
          - "+ 30 'd'"
          - "+ 1 'wk'"
          - "+ 1.5 'wk'"
      - title: Calendar duration quantity arithmetic gaps
        type: feature
        id: "#159"
        comment: |
          Operations mixing calendar durations with UCUM quantities or between
          calendar duration types return incorrect results. Similar to Pathling #2494.
        outcome: failure
        any:
          - ".toQuantity('s') * (1 year).toQuantity('seconds')"
          - "1 'mo' / (1 year).toQuantity('seconds')"
          - "1 'kg' / (3 months).toQuantity('seconds')"
          - "3 month / 2 year"
          - "1 year / 2 = 6 months"
          - "(1 year + 6 months).toQuantity('seconds')"
          - "2 years + 6 months = 2.5 year"
          - "3 year - 1 year = 2 year"
          - "1 year - 6 months - 1 year + 18 months"
          - "1 year * 2 = 2 year"
          - "2 * 5 months = 10 months"
          - "1 year / 6 months = 2"
      - title: Date/time arithmetic precision and timezone gaps
        type: feature
        id: "#160"
        comment: |
          Sub-day precision arithmetic on dates, timezone normalization, and
          fractional week calculations.
        outcome: failure
        any:
          - "@2016-01 + 1 hour"
          - "@2016-01-01 + 24 hours"
          - "@2016-01-01 + 47 hours"
          - "@2018-02-18T12:23:45-05:00 + 2 years"
          - "@2016-02-28 + 1.5 weeks"
          - "@2016-02-28 - 1.5 weeks"
          - "@2018-02-18T12 + 59 minutes"
          - "@2018-02-18T12 + 60 minutes"
      - title: Time plus incompatible duration
        type: feature
        id: "#160"
        comment: |
          Adding years to a Time literal should error per the FHIRPath spec, but
          fp2sql returns null instead.
        outcome: failure
        any:
          - "@T09:45:23 + 2 years"
      - title: Unary minus on Quantity not supported
        type: bug
        id: "#187"
        comment: |
          The expression produces a negative Quantity via subtraction, but fp2sql
          has no overload for unary minus on Quantity type. Same root cause as
          the fhir-r4.yaml (-5.5 'mg').abs() exclusion.
        outcome: error
        desc:
          - "Can subtract a UCUM time-valued quantity from a calendar duration quantity less than or equal to seconds"
      - title: Quantity + Date/DateTime/Time commutation (fhirpath.js ext beyond spec)
        type: ref-impl-bug
        comment: |
          R6. FHIRPath spec §6.6.5/6.6.7 define the time-valued Quantity arithmetic
          operators with the signature (Date/DateTime/Time + Quantity). The reverse
          operand order is not defined. fhirpath.js permissively commutes operands
          (src/math.js:70-77), evaluating `Quantity + Date` as `Date + Quantity`.
          fp2sql follows the spec signature strictly and rejects at overload
          resolution. See SPEC_DIVERGENCES.md R6.
        outcome: error
        any:
          - "1 year + @2016-02-29"
      - title: YAML test harness ignores model field
        type: test-infra
        id: "#161"
        comment: |
          The test executor always loads inputfile-backed subjects as FHIR resources
          regardless of the model field.
        outcome: failure
        desc:
          - "Do not convert a resource node value to Date without model"
  # ---------------------------------------------------------------------------
  # fp2sql — 5.6_string_manipulation.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — 5.6_string_manipulation.yaml exclusions
    glob: "5.6_string_manipulation.yaml"
    exclude:
      - title: Array subject field Functions.str has MANY cardinality
        type: design
        comment: |
          The YAML subject defines str as a one-element array, giving it MANY cardinality.
          String functions require singleton input (? cardinality), so all expressions
          traversing Functions.str.* fail with CardinalityMismatchException at compile time.
          This is D1 (static typing) — fp2sql rejects MANY-cardinality operands statically.
          See SPEC_DIVERGENCES.md D1.
        outcome: error
        expression:
          - "^Functions\\.str\\."
      - title: matches() does not enable dotAll mode
        type: bug
        id: "#167"
        comment: |
          FHIRPath spec says matches() uses dotAll semantics (. matches any character
          including newlines). fp2sql's implementation does not enable Pattern.DOTALL,
          so multiline tests fail.
        outcome: failure
        desc:
          - "matches with dotAll"
      - title: Union of string literals with '|' without surrounding whitespace
        type: design
        outcome: error
        comment: |
          D7. fp2sql's CODING literal lexer greedily consumes
          `'a'|'b'` as a single CODING token, so these expressions
          fail at parse time. fhirpath.js has no CODING literals
          and parses the same input as a union of string literals.
          Workaround: put whitespace around '|' (e.g. 'a' | 'b').
          See SPEC_DIVERGENCES.md D7.
        any:
          - "('a'|'b'|'c').join(',')"
          - "('a'|'b'|'c').join()"
      - title: Union of string literals with '|' — yaml already expects error
        type: design
        outcome: pass
        comment: |
          D7 (see above). This case has `error: true` in the YAML, and
          fp2sql does raise a parse error for the same CODING-literal
          reason, so the test passes as-is. Recorded as a pass-exclusion
          to document the divergent root cause (fhirpath.js errors at
          runtime when converting a Date into the string union; fp2sql
          errors at parse time before evaluating anything).
          See SPEC_DIVERGENCES.md D7.
        any:
          - "('a'|'2023-05-28'.toDate()|'c').join(',')"
  # ---------------------------------------------------------------------------
  # fp2sql — 5.7_math.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — 5.7_math.yaml exclusions
    glob: "5.7_math.yaml"
    exclude:
      - title: Empty list [] inferred as MANY cardinality
        type: bug
        id: "#156"
        comment: |
          YAML subject field n2: [] is inferred as MANY cardinality by
          ResourceTypeInference, causing compile-time CardinalityMismatchException.
          Same root cause as the 6.6_math.yaml n4 exclusion.
        outcome: error
        expression:
          # Word-boundary match to avoid false positives on e.g. n20
          - "\\bn2\\b"
  # ---------------------------------------------------------------------------
  # fp2sql — 3.2_paths.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — 3.2_paths.yaml exclusions
    glob: "3.2_paths.yaml"
    exclude:
      - title: Choice type polymorphism — Observation.value
        type: design
        comment: |
          Observation.value is a choice type; fp2sql requires ofType() to resolve it.
          The global choice-type rule's regex misses bare end-of-string expressions.
          See SPEC_DIVERGENCES.md D6.
        outcome: error
        expression:
          - "^Observation\\.value$"
      - title: Contained resources not supported
        type: design
        comment: |
          Traversal into contained resources is not supported.
          See SPEC_DIVERGENCES.md D2.
        any:
          - "contained"
      - title: Custom non-FHIR fields not in encoded schema
        type: feature
        id: "#170"
        comment: |
          The YAML subject defines a CustomField field not present in the FHIR
          Observation schema. Pathling encoders only serialize FHIR-defined fields,
          so CustomField is absent from the encoded dataset. Traversal to undefined
          fields should return an empty collection.
        outcome: failure
        any:
          - "CustomField"
  # ---------------------------------------------------------------------------
  # fp2sql — 6.5_boolean_logic.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — 6.5_boolean_logic.yaml exclusions
    glob: "6.5_boolean_logic.yaml"
    exclude:
      - title: Empty list [] inferred as MANY cardinality
        type: bug
        id: "#156"
        comment: |
          YAML subject field emp: [] is inferred as MANY cardinality by
          ResourceTypeInference, causing compile-time CardinalityMismatchException
          for boolean operators that require ? cardinality operands.
          Same root cause as the 5.7_math.yaml n2 and 6.6_math.yaml n4 exclusions.
        outcome: error
        any:
          - "emp"
      - title: Strict typing rejects not() on Integer
        type: design
        comment: |
          FHIRPath spec allows not() on any singleton via implicit boolean coercion.
          fp2sql's static type system requires Boolean input — (0).not() fails
          overload resolution because 0 is Integer. See SPEC_DIVERGENCES.md D1.
        outcome: error
        expression:
          - "\\(0\\)\\.not\\(\\)"
  # ---------------------------------------------------------------------------
  # fp2sql — fhir-r4.yaml exclusions
  # ---------------------------------------------------------------------------
  - title: fp2sql — fhir-r4.yaml exclusions
    glob: "fhir-r4.yaml"
    exclude:
      - title: Choice type traversal without narrowing
        type: design
        outcome: failure
        comment: |
          D6. Observation.value is a choice type — direct field traversal (.value)
          requires ofType() narrowing first. See SPEC_DIVERGENCES.md D6.
        any:
          - "Observation.value.value < 'test'"
      - title: Strict typing rejects not() on Integer
        type: design
        comment: |
          D1. not() requires Boolean input — (1).not() fails overload resolution
          because 1 is Integer. See SPEC_DIVERGENCES.md D1.
        outcome: error
        any:
          - "(1).not() = false"
      - title: "$this used outside expression (lambda) parameter"
        type: ref-impl-bug
        comment: |
          R4. FHIRPath spec defines $this only within functions that take an expression
          parameter. fhirpath.js allows $this in subsetOf/supersetOf collection arguments.
          See SPEC_DIVERGENCES.md R4.
        outcome: error
        any:
          - "subsetOf($this"
          - "supersetOf($this"
      - title: "3-arg iif() with else-branch not implemented"
        type: feature
        id: "#186"
        comment: |
          fp2sql only implements the 2-arg iif(criterion, true-result) form.
          The 3-arg form with an else-branch is not yet supported.
        outcome: error
        any:
          - "** testCollectionBoolean2"
          - "** testCollectionBoolean3"
          - "** testCollectionBoolean4"
          - "** testIif1"
          - "** testIif2"
          - "** testIif3"
          - "** testIif4"
      - title: Unary negation of Quantity not implemented
        type: bug
        id: "#187"
        comment: |
          FHIRPath spec §5.7 explicitly shows (-5.5 'mg').abs() as a valid example.
          fp2sql does not implement unaryMinus for Quantity operands.
        outcome: error
        any:
          - "(-5.5 'mg').abs()"
      - title: "fhirpath.js operator precedence: is vs comparison"
        type: ref-impl-bug
        comment: |
          R3. Spec defines is/as (#06) higher than comparison (#08). fhirpath.js
          parses '1 > 2 is Boolean' as '(1 > 2) is Boolean' instead of
          '1 > (2 is Boolean)'. See SPEC_DIVERGENCES.md R3.
        outcome: error
        any:
          - "1 > 2 is Boolean"
  - title: fp2sql — 4.1_literals.yaml exclusions
    glob: "fhirpath-js/cases/4.1_literals.yaml"
    exclude:
      - title: "Backtick-wrapped literal with invalid escape sequences"
        type: bug
        id: "#211"
        outcome: failure
        comment: |
          fp2sql's ANTLR grammar for DELIMITEDIDENTIFIER is too permissive
          (uses `.` instead of the spec's `~[\\`]`), so escapes like `\"`
          inside backticks are consumed silently rather than raising a
          parse error. fhirpath.js errors correctly per spec. Tracked
          under #211 bullet 3 (backtick-wrapped strings as literals —
          spec says parse error).
        any:
          - "`a\\\\b\\'\\\"\\`\\r\\n\\t\\u0065`"
  - title: fp2sql — hasValue.yaml exclusions
    glob: "hasValue.yaml"
    exclude:
      - title: hasValue() on multi-valued paths
        type: design
        comment: |
          D1. hasValue() requires a singleton operand; fp2sql rejects `*`-cardinality
          inputs at compile time. fhirpath.js returns false on MANY collections by
          element-wise evaluation. See SPEC_DIVERGENCES.md D1 (static typing and
          cardinality).
        any:
          - "Patient.identifier.hasValue()"
          - "Patient.name.hasValue()"
          - "Patient.name.given.hasValue()"
  # ---------------------------------------------------------------------------
  # fp2sql — per-file "skip entirely" sets, awaiting triage
  #
  # These files contain a mix of semi-synthetic subjects, choice types, FHIRPath features
  # that fp2sql has not fully implemented, and analyzer gaps. Each is skipped wholesale
  # with a `disabled-file` set so the infrastructure can run all 26 files today while
  # follow-up issues enable them one-by-one.
  #
  # The `any: [""]` matcher matches every test case in the target file; omitting `outcome`
  # turns the match into a plain skip (TestAbortedException).
  # ---------------------------------------------------------------------------
  - title: fp2sql — skip entire 6.3_types.yaml
    glob: "6.3_types.yaml"
    exclude:
      - title: Pending triage
        type: feature
        comment: |
          is/as operators require singleton input in fp2sql, whereas fhirpath.js applies them
          element-wise. Needs either analyzer relaxation or per-case rewrites to ofType().
        any:
          - ""
  - title: fp2sql — skip entire 6.4_collection.yaml
    glob: "6.4_collection.yaml"
    exclude:
      - title: Pending triage
        type: feature
        comment: |
          Subject is a top-level list of maps, not a FHIR resource. fp2sql has no adapter
          for that shape.
        any:
          - ""
  - title: fp2sql — skip entire 6.4_collections.yaml
    glob: "6.4_collections.yaml"
    exclude:
      - title: Pending triage
        type: feature
        comment: |
          Arbitrary subject with nested Maps ({a: 1} style elements) plus a handful of
          strict-typing differences. Follow-up work.
        any:
          - ""
  - title: fp2sql — skip entire 8_variables.yaml
    glob: "8_variables.yaml"
    exclude:
      - title: Pending triage
        type: feature
        comment: |
          Variable injection is not yet supported by the executor bridge.
        any:
          - ""
  - title: fp2sql — skip entire fhir-quantity.yaml
    glob: "fhir-quantity.yaml"
    exclude:
      - title: Pending triage
        type: feature
        comment: |
          Quantity comparison and canonicalisation tests that fp2sql does not yet implement.
        any:
          - ""
  - title: fp2sql — 5.3_subsetting.yaml exclusions
    glob: "fhirpath-js/cases/5.3_subsetting.yaml"
    exclude:
      - title: "Primitive attributes: .first().id on collection with null primitives"
        type: design
        outcome: failure
        comment: |
          D3. fp2sql does not support attributes on primitive types. The expression
          `Functions.collWithNullsAndTrue.first().id` traverses to the `id` of a
          primitive element, which per D3 returns empty rather than the id. See
          SPEC_DIVERGENCES.md D3 (No support for attributes on primitive types).
        any:
          - "** first for collection with null values"
  - title: fp2sql — 5.1_existence.yaml exclusions
    glob: "fhirpath-js/cases/5.1_existence.yaml"
    exclude:
      - title: "Primitive elements with extensions but no value are invisible"
        type: design
        outcome: failure
        comment: "D3: fp2sql does not support attributes on primitive types."
        any:
          - "** null is not empty"
          - "** exists for null should return true"
      - title: "Static typing rejects multi-valued boolean at compile time"
        type: design
        outcome: failure
        comment: "D1: fp2sql requires statically single-valued operands for not()."
        any:
          - "** error for collection that is not a singleton"
      - title: "isDistinct() on primitives with null values but present extensions"
        type: design
        outcome: failure
        comment: |
          D3. fp2sql treats primitive elements with only extensions (no value)
          as absent. fhirpath.js includes them as distinct "null" items, so
          combine() followed by isDistinct() disagrees on collections backed by
          _given extension-only slots.
          See SPEC_DIVERGENCES.md D3.
        any:
          - "(Patient.name.given[0]).combine(Patient.name.given[3]).isDistinct()"
  - title: fp2sql — 5.2_filtering_and_projection.yaml exclusions
    glob: "fhirpath-js/cases/5.2_filtering_and_projection.yaml"
    exclude:
      - title: "Monomorphic collections cannot represent mixed-type arrays"
        type: design
        outcome: failure
        comment: "D4: fp2sql only supports monomorphic collections."
        any:
          - "heteroattr.ofType(String)"
          - "heteroattr.ofType(Integer)"
          - "heteroattr.ofType(Decimal)"
          - "heteroattr.ofType(Boolean)"
      - title: "select() accessing .id on primitive elements"
        type: design
        outcome: failure
        comment: "D3: fp2sql does not support attributes on primitive types."
        any:
          - "Patient.name.given.select($this & $this.id)"
      - title: "where() filtering on .id of primitive elements"
        type: design
        outcome: failure
        comment: "D3: fp2sql does not support attributes on primitive types."
        any:
          - "Patient.name.given.where(id = 'Jacomus1Id').count()"
      - title: "repeat() on .id of primitive elements"
        type: design
        outcome: failure
        comment: "D3: fp2sql does not support attributes on primitive types."
        any:
          - "Patient.name.given.repeat(id)"
  - title: fp2sql — 6.1_equality.yaml exclusions
    glob: "fhirpath-js/cases/6.1_equality.yaml"
    exclude:
      - title: "Bundles are not supported"
        type: feature
        id: "#208"
        comment: |
          Pathling encoders reject non-encodable resource types like Bundle.
        expression:
          - "(^|\\W)Bundle(\\W|$)"
      - title: "Primitive elements with extensions but no value"
        type: design
        comment: |
          Patient.name.given[3] has no value but has an extension in _given[3].
          fp2sql does not support this structure. See SPEC_DIVERGENCES.md D3.
        outcome: failure
        any:
          - "** equality for null values"
          - "** inequality for null values"
      - title: Unsupported equality for complex types
        type: bug
        id: "#134"
        comment: |
          Complex type equality: Pathling _fid synthetic fields cause false
          negatives on Column.equalTo over encoded structs. See #134.
        any:
          - "** two objects"
          - "** two objects not"
      - title: Unsupported equality for collections of complex types
        type: bug
        id: "#134"
        comment: |
          Complex type equality: Pathling _fid synthetic fields cause false
          negatives on Column.equalTo over encoded structs. See #134.
        expression:
          - "Ops.coll = Ops.collsame"
          - "Ops.coll = Ops.collother"
      - title: Unsupported calendar-duration equality across unit scales
        type: feature
        outcome: failure
        id: "#224"
        any:
          - "12 months = 1 year"
          - "1 month = 30 days"
          - "1 week = 7 day"
          - "1 day = 24 hours"
      - title: Calendar duration != UCUM literal returns true instead of empty
        type: ref-impl-bug
        id: "R1"
        comment: |
          fhirpath.js expects true but the spec says empty (calendar and definite
          durations above seconds are un-comparable for equality).
          See SPEC_DIVERGENCES.md R1.
        outcome: failure
        any:
          - "1 year != 1 'a'"
          - "1 month != 1 'mo'"
      - title: UCUM quantity arithmetic in equality
        type: feature
        id: "#176"
        comment: |
          Complex UCUM quantity arithmetic (unit conversion, multiplication, division)
          is not yet supported.
        outcome: failure
        any:
          - "10 'kg.m/s2' = 5 'kg'"
      - title: Different-precision temporal equality
        type: feature
        id: "#174"
        comment: |
          FHIRPath equality of date/time/dateTime values at different precisions
          should return empty. fp2sql returns empty for some but not all cases.
        outcome: failure
        any:
          - "@2018 = @2019-02"
          - "@2018-02-03 != @2018-01"
          - "@T12:35 != time1.toTime()"
      - title: Timezone-aware dateTime equality
        type: feature
        id: "#175"
        comment: |
          DateTime equality should normalize timezones before comparing.
          fp2sql does not perform timezone normalization.
        outcome: failure
        any:
          - "@2018-02-02T22-04:00 = @2018-02-03T06+04:00"
          - "@2018-02-02T22-04:00 = @2018-02-03T05:03+04:00"
  - title: fp2sql — 6.2_comparision.yaml exclusions
    glob: "fhirpath-js/cases/6.2_comparision.yaml"
    exclude:
      - title: Unsupported comparison above second calendar durations
        type: feature
        outcome: failure
        id: "#224"
        any:
          - "1 year > 12 months"
          - "1 year < 12 months"
          - "1 minute > 59 seconds"
          - "1 minute < 61 seconds"
      - title: Empty list [] inferred as MANY cardinality in comparison
        type: bug
        id: "#156"
        comment: |
          Subject field e: [] is inferred as MANY cardinality by ResourceTypeInference,
          causing compile-time CardinalityMismatchException when used in comparisons.
          Same root cause as the 6.6_math.yaml n4 exclusion.
        outcome: error
        any:
          - "with empty value"
      - title: Different-precision temporal comparison
        type: feature
        id: "#174"
        comment: |
          FHIRPath comparison of date/time/dateTime values at different precisions
          should compare based on the lesser precision. fp2sql returns empty instead.
        outcome: failure
        any:
          - "@2018 > @2017-01"
          - "@2018-12-20T12 > @2018-12-20T11:01"
          - "@T12:02:34.324 > @T12:01"
          - "@2020 >= date.toDate()"
          - "@2018 >= date.toDate()"
      - title: Choice type polymorphism for DiagnosticReport.effective
        type: design
        comment: |
          DiagnosticReport.effectiveDateTime is a typed accessor for the effective[x]
          choice element. fp2sql requires ofType() for choice elements.
          See SPEC_DIVERGENCES.md D6.
        outcome: error
        expression:
          - "DiagnosticReport\\.effectiveDateTime"
      - title: Instant to dateTime literal comparison bug
        type: bug
        id: "#172"
        comment: |
          Comparing FHIR.instant field to a dateTime literal causes a ClassCastException
          (Timestamp cannot be cast to String) in Spark UDF execution.
        outcome: error
        any:
          - "DiagnosticReport.issued = @2005-01-27T06:40:01Z"
  - title: Types exclusions
    glob: "fhirpath-js/cases/6.3_types.yaml"
    exclude:
      - title: "Primitive elements with extensions but no value not supported"
        type: feature
        outcome: failure
        id: "#437"
        comment: |
          Pathling does not support accessing primitive elements that have extensions
          but no value. In this test, Patient.name.given[3] exists only as an extension
          in _given[3] but has no value in the given array. The is() function should
          return true for such elements, but Pathling returns null because it doesn't
          recognize the element as existing.
        any:
          - "Patient.name.given[3].is(FHIR.string)"
      - title: "as() operator with count() on primitive elements with extensions but no value"
        type: feature
        outcome: failure
        id: "#437"
        comment: |
          These tests use count() to verify that as() successfully converts
          Patient.name.given[3], which is a primitive element with extensions but
          no value. Since Pathling doesn't support accessing such elements, count()
          returns 0 instead of 1, causing the comparison to fail.
        any:
          - "(Patient.name.given[3] as FHIR.string).count() = 1"
          - "Patient.name.given[3].as(FHIR.string).count() = 1"
      - title: "fhirpath.js operator precedence: is vs comparison"
        type: ref-impl-bug
        outcome: error
        comment: |
          R3. Spec defines is/as (#06) higher than comparison (#08). '1 > 2 is Boolean'
          parses as '1 > (2 is Boolean)' = '1 > true', a type error. fhirpath.js parses
          as '(1 > 2) is Boolean'. See SPEC_DIVERGENCES.md R3.
        any:
          - "1 > 2 is Boolean"
      - title: "'is' operator on fields accessed through polymorphic collections"
        type: wontfix
        comment: |
          Tests require traversing Observation.value (polymorphic) before applying 'is'.
          Pathling requires ofType() for polymorphic field traversal.
        any:
          - "Observation.value.value is decimal"
          - "Observation.value.value is Element"
          - "Observation.value.system is uri"
          - "Observation.value.unit is string"
          - "Observation.value.unit is decimal"
      - title: "'is' operator with extensions on primitive types not supported"
        type: feature
        outcome: failure
        id: "#437"
        comment: |
          Pathling does not support accessing extensions on primitive elements.
          These tests involve the 'is' operator on extension values or primitive elements
          with extensions, which return null instead of the expected type check result.
        any:
          - "Patient.contact.name.family.extension('http://hl7.org/fhir/StructureDefinition/humanname-own-prefix').value is string"
          - "Patient.contact.name.family.extension('http://hl7.org/fhir/StructureDefinition/humanname-own-prefix').url is System.String"
          - "Patient.name.given[3] is FHIR.string"
      - title: "Type hierarchy checking not yet implemented"
        type: feature
        outcome: failure
        id: "#2524"
        comment: |
          The is, as, and ofType operations currently only support exact type matching
          and do not check FHIR type hierarchy (e.g., checking if a value is a subtype
          of the specified type). This will be implemented using HAPI FHIR implementation
          classes and Class.isAssignableFrom() to check inheritance.
        any:
          - "Observation is DomainResource"
          - "Observation is Resource"
          - "Observation.value is Element"
          - "Patient.contact is Element"
      - title: "FHIR and System type namespace distinction not preserved (as)"
        type: bug
        id: "#188"
        outcome: failure
        comment: |
          Per FHIR FHIRPath spec, as() must distinguish FHIR types from System types.
          '1 year' is System.Quantity; as(FHIR.Quantity) should return empty.
          Same root cause as the fhir-r4 is(Boolean) exclusion.
        any:
          - "1 year.as(FHIR.Quantity)"
          - "1 year as FHIR.Quantity"
      - title: "Mixed-type collections not supported"
        type: design
        outcome: failure
        comment: |
          D4. fp2sql only supports monomorphic collections. mixedTypeVals contains
          heterogeneous types which cannot be represented. See SPEC_DIVERGENCES.md D4.
        any:
          - "mixedTypeVals.as(Integer)"
          - "mixedTypeVals as Integer"
          - "mixedTypeVals.select($this as Integer)"
          - "mixedTypeVals.select($this.as(Integer))"
  - title: Collections exclusions
    glob: "fhirpath-js/cases/6.4_collections.yaml"
    exclude:
      - title: Unsupported equality for complex types
        type: feature
        id: "#2420"
        expression:
          - "el in coll"
          - "not_el in coll"
          - "^coll contains el"
          - "coll contains not_el"
  - title: fp2sql — 5.5_conversion.yaml exclusions
    glob: "fhirpath-js/cases/5.5_conversion.yaml"
    exclude:
      - title: Missing implicit FHIR-to-System type conversion for ANY parameters
        comment: |
          Functions accepting ANY don't trigger implicit FHIR-to-System type conversion.
          toString() on FhirPrimitiveType and toQuantity() on FhirComplexType (Duration)
          both fail with "Expected SystemType" errors.
        type: bug
        id: "#180"
        outcome: error
        any:
          - "Patient.name.given[0].toString()"
          - "MedicationRequest.dispenseRequest.expectedSupplyDuration.toQuantity() = 3 days"
      - title: No support for attributes on primitive types
        comment: |
          Null-valued primitives with extensions (e.g., collWithNullsAndTrue[0]) are
          invisible due to D3. See SPEC_DIVERGENCES.md D3.
        type: design
        outcome: failure
        any:
          - "Functions.collWithNullsAndTrue[0].toBoolean()"
          - "Functions.collWithNullsAndTrue[0].toInteger()"
          - "Functions.collWithNullsAndTrue[0].toDecimal()"
          - "Functions.collWithNullsAndTrue[0].toQuantity()"
      - title: Calendar duration != UCUM literal returns true instead of empty
        type: ref-impl-bug
        id: "R1"
        comment: |
          fhirpath.js expects true but the spec says empty.
          See SPEC_DIVERGENCES.md R1.
        outcome: failure
        any:
          - "'1 year'.toQuantity() != 1 'a'"
      - title: "UCUM to calendar duration conversion supported across seconds boundary"
        comment: |
          D8. fp2sql permits toQuantity() conversion between UCUM definite-duration
          units and calendar-duration keywords across the seconds boundary (e.g.,
          '1 \'wk\''.toQuantity('days') → 7 'd'). fhirpath.js refuses this conversion
          (returns []). Neither violates the spec, which is silent on cross-system
          conversion above seconds. See SPEC_DIVERGENCES.md D8.
        type: design
        outcome: failure
        any:
          - '''1 \''wk\''''.toQuantity(''days'')'
  - title: Variable exclusions
    glob: "fhirpath-js/cases/8_variables.yaml"
    exclude:
      - title: "Unsupported context definition within view runner"
        type: feature
        outcome: failure
        id: "#2424"
        spel:
          - "#testCase.context == 'g1'"
  - title: fp2sql — extensions.yaml exclusions
    glob: "fhirpath-js/cases/extensions.yaml"
    exclude:
      - title: "Primitive collection traversal does not filter null values"
        comment: |
          FHIRPath collections cannot contain null (spec "Null and empty"); the JSON
          positional-null convention used to align `given` with `_given` must be filtered
          out during primitive field traversal. fp2sql returns [null, Peter, James]
          instead of [Peter, James].
        type: bug
        outcome: failure
        id: "#192"
        any:
          - "** exclude null values from the result"
      - title: "ID on primitive types not supported"
        comment: |
          D3. FHIR primitive elements can carry id/extension attributes alongside their
          value, but fp2sql does not support this structure — .id on primitives returns
          empty, and primitives with attributes-but-no-value are invisible. See
          SPEC_DIVERGENCES.md D3 (no support for attributes on primitive types).
        type: design
        outcome: failure
        any:
          - "** id for primitive type"
          - "Patient.address[1].id = 'someId'"
          - "** count nodes without value, but with extensions"
      - title: "extension() on primitive types — passes trivially (outcome: pass)"
        comment: |
          D3. FHIR primitive elements can carry id/extension attributes alongside their
          value, but fp2sql does not support this structure — .extension() on primitives
          returns empty. This case passes trivially because the expected result is also
          empty. See SPEC_DIVERGENCES.md D3 (no support for attributes on primitive
          types).
        type: design
        outcome: pass
        any:
          - "** expression with extension for primitive type 1"
      - title: "extension() on primitive types not supported (outcome: failure)"
        comment: |
          D3. FHIR primitive elements can carry id/extension attributes alongside their
          value, but fp2sql does not support this structure — .extension() on primitives
          returns empty, so expressions that navigate through primitive extensions yield
          no result. See SPEC_DIVERGENCES.md D3 (no support for attributes on primitive
          types).
        type: design
        outcome: failure
        any:
          - "** expression with extension for primitive type 3"
          - "Patient.communication.preferred.extension('test').value.id"
          - "Patient.communication.preferred.extension('test').exists()"
          - "Patient.name.given[0].extension('http://hl7.org/fhir/StructureDefinition/display').value = 'Jacomus1'"
          - "Patient.name.given[3].extension('http://hl7.org/fhir/StructureDefinition/display').value = 'Jacomus2'"
          - "** value of extension of extension (using FHIR model data)"
          - "** id of extension of extension"
          - "** expression with extension() for primitive type (using FHIR model data)"
          - "Patient.birthDate.extension .where(url = 'http://hl7.org/fhir/StructureDefinition/patient-birthTime') .valueDateTime.toDateTime() = @1974-12-25T14:35:45-05:00"
          - "Patient.birthDate.extension('http://hl7.org/fhir/StructureDefinition/patient-birthTime') .valueDateTime.toDateTime() = @1974-12-25T14:35:45-05:00"
  - title: Quantity Exclusions
    glob: "fhirpath-js/cases/fhir-quantity.yaml"
    exclude:
      - title: "Implicit conversion of polymorphic types not supported"
        id: "#2163"
        comment: "Should the value be implicitly converted to a quantity?"
        type: feature
        any:
          - "After converting 'a' to year it is equal to year"
          - "After converting 'a' to year it isn't equal to 'a'"
          - "After converting 'min' to minutes it is equal to minutes"
          - "Can access the comparator field when there isn't a need to convert"
  - title: Simple Exclusions
    glob: "fhirpath-js/cases/simple.yaml"
    exclude:
      - title: "Tick quotes identifiers not supported"
        id: "#2153"
        type: bug
        outcome: failure
        any:
          - "name.`family`"
      - title: "exists(criteria) with non-boolean collection criteria"
        type: design
        outcome: error
        comment: "D1: exists(given) uses a collection-valued expression as criteria; fp2sql strict typing requires boolean."
        any:
          - "Patient.name.exists(given)"
      - title: "Bare length without parentheses treated as field access"
        type: ref-impl-bug
        outcome: failure
        comment: "R2: FHIRPath spec §5 requires parentheses for functions. fhirpath.js treats bare length as length()."
        any:
          - "Patient.name.given.select($this.length) = Patient.name.given.select(length)"
      - title: "Unsupported type runner feature: expression maps"
        id: "#184"
        type: test-infra
        any:
          - "Evaluating expression for a part of a resource"
      - title: "Complex structure comparison in test assertions"
        id: "#185"
        type: test-infra
        outcome: failure
        comment: "Test infrastructure cannot compare complex FHIR structures returned by fp2sql with expected JSON."
        any:
          - "Patient.telecom.where($this.use = 'work')"
      - title: "type() null handling and TypeInfo format"
        id: "#182"
        type: bug
        outcome: failure
        comment: >-
          type() returns null for null elements (#182) and TypeInfo struct includes baseType
          per CI build spec (D5). After #182 is fixed, reclassify this exclusion to design (D5).
        desc:
          - "type() function for the null element of a collection"
      - title: "ofType() does not filter null elements"
        id: "#182"
        type: bug
        outcome: failure
        comment: "ofType(string) should exclude null elements; fp2sql includes them."
        desc:
          - "ofType() function for the null element of a collection (2)"
  - title: fp2sql — 5.4_combining.yaml exclusions
    glob: "fhirpath-js/cases/5.4_combining.yaml"
    exclude:
      - title: "Polymorphic unions not supported"
        type: design
        comment: "D4: fp2sql only supports monomorphic collections."
        any:
          - "Functions.attrdouble | Functions.coll1.colltrue.attr"
      - title: "Calendar duration year/month conversion missing for equality"
        type: bug
        outcome: failure
        id: "#178"
        comment: |
          fp2sql does not implement the spec's year-to-month conversion factor
          (1 year = 12 months) for quantity equality comparison. The reference
          implementation correctly deduplicates (1 year | 12 months) to '1 year'.
        any:
          - "(1 year | 12 months)"
      - title: "Primitive elements with extensions but no value are invisible"
        type: design
        outcome: failure
        comment: "D3: fp2sql does not support attributes on primitive types."
        any:
          - "(Patient.name.given[0] | Patient.name.given[3]).count()"
          - "(Patient.name.given[0]).combine(Patient.name.given[3]).count()"
          - "Patient.name.given[0].union(Patient.name.given[3]).count()"
  - title: FHIR R4 Exclusions
    glob: "fhirpath-js/cases/fhir-r4.yaml"
    exclude:
      - title: "Tick quotes identifiers not supported"
        outcome: failure
        id: "#2153"
        type: bug
        any:
          - "** testEscapedIdentifier"
          - "** testSimpleBackTick1"
      - title: "Tick quotes identifiers not supported"
        id: "#2153"
        type: bug
        any:
          - "Patient.ofType(FHIR.`Patient`).type().name"
      - title: "Implicit conversion of polymorphic types not supported"
        type: feature
        id: "#2163"
        any:
          - "Observation.value.unit"
          - "** testLiteralDecimalGreaterThanNonZeroTrue"
          - "** testLiteralDecimalGreaterThanZeroTrue"
          - "** testLiteralDecimalGreaterThanIntegerTrue"
          - "** testLiteralDecimalLessThanInteger"
          - "** testEquality28"
          - "** testNEquality24"
          - "** testLessThan22"
          - "** testLessOrEqual22"
          - "Observation.value >= 100 '[lb_av]'"
          - "Observation.value > 100 '[lb_av]'"
      - title: "incorrect multiplication/division of quantity literals"
        id: "#2168"
        comment: "E.g: 2.0 'cm' * 2.0 'm' = 0.040 'm2'"
        type: bug
        any:
          - "** testQuantity9"
          - "** testQuantity10"
      - title: "3-arg iif() with else-branch not implemented"
        comment: "E.g.: iif(true, true, 1/0). Same as fp2sql fhir-r4 iif exclusion."
        type: feature
        id: "#186"
        any:
          - "** testCollectionBoolean5"
          - "** testCollectionBoolean6"
      - title: "Decimal literal exceeded maximum scale supported"
        id: "#2144"
        type: feature
        any:
          - "** testNEquality22"
          - "1.2 / 1.8 = 0.66666667"
          - "1.00000001.truncate() = 1"
          - "0.00000001.convertsToDecimal()"
      - title: "Extensions on primitive types not supported"
        type: feature
        outcome: failure
        id: "#437"
        any:
          - "Patient.birthDate.extension('http://hl7.org/fhir/StructureDefinition/patient-birthTime').exists()"
      - title: "Extensions on primitive types not supported"
        type: feature
        outcome: pass
        id: "#437"
        any:
          - "Patient.birthDate.extension('http://hl7.org/fhir/StructureDefinition/patient-birthTime1').empty()"
      - title: Unsupported equality for complex types
        type: feature
        id: "#2420"
        expression:
          - "name = name"
          - "name != name"
      - title: Unsupported comparison above second calendar durations
        type: feature
        outcome: failure
        id: "#2494"
        any:
          - "7 days = 1 week"
          - "6 days < 1 week"
          - "8 days > 1 week"
      - title: "FHIR and System type namespace distinction not preserved"
        type: bug
        id: "#188"
        outcome: failure
        comment: |
          Per FHIR FHIRPath spec, is() and as() must distinguish FHIR primitive types
          from System types (e.g., FHIR.boolean vs System.Boolean). Pathling maps FHIR
          primitives to System types internally, causing is(Boolean) to return true for
          FHIR.boolean values. The spec explicitly calls is() an exception to automatic
          FHIR-to-System type conversion.
        any:
          - "Patient.active.is(Boolean).not()"
          - "Patient.active.is(System.Boolean).not()"
      - title: "fhirpath.js operator precedence: is vs union"
        type: ref-impl-bug
        outcome: error
        comment: |
          R3. Spec defines is/as (#06) higher than union (#07). '1 | 1 is Integer'
          parses as '1 | (1 is Integer)' = '1 | true', rejected as type error.
          fhirpath.js parses as '(1 | 1) is Integer'. See SPEC_DIVERGENCES.md R3.
        any:
          - "1 | 1 is Integer"
      - title: "Recursive ValueSet.expansion.contains not encoded"
        type: feature
        id: "#190"
        outcome: failure
        comment: |
          The encoder explicitly skips the recursive 'contains' field within
          ValueSetExpansionContainsComponent (see R4DataTypeMappings.skipField).
          This means nested contains entries are not available in the Spark schema,
          so repeat(contains) only finds top-level entries.
        any:
          - "** testRepeat1"
